name: macOS

on:
  push:
    branches:
      - master
      - ci/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

env:
  MELONDS_GIT_BRANCH: ${{ github.ref_name }}
  MELONDS_GIT_REPO: ${{ github.repository }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]

    name: ${{ matrix.arch }}
    runs-on: macos-26

    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
      - name: Install dependencies for package building
        run: |
          brew install autoconf automake autoconf-archive libtool python-setuptools
      - name: Set up CMake
        uses: lukka/get-cmake@latest
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ matrix.arch }}-osx-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.arch }}-osx-
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Build
        uses: lukka/run-cmake@v10
        with:
          configurePreset: release-mac-${{ matrix.arch }}
          buildPreset: release-mac-${{ matrix.arch }}
          configurePresetAdditionalArgs: "['-DMELONDS_EMBED_BUILD_INFO=ON']"
      # the job log isn't always reachable: repeat the failing part of the
      # build and show the compiler's errors as annotations
      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          cmake --build --preset release-mac-${{ matrix.arch }} -- -k 0 2>&1 | grep -E "error[: ]" | head -40 | sed 's/^/::error::/' || true
      - name: Compress app bundle
        shell: bash
        run: |
          cd build/release-mac-${{ matrix.arch }}
          zip -r -y ../../melonRA-macOS-${{ matrix.arch }}.zip melonRA.app
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: melonRA-macOS-${{ matrix.arch }}
          path: melonRA-macOS-${{ matrix.arch }}.zip
          retention-days: 1
          archive: false
      - name: Save vcpkg cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ matrix.arch }}-osx-${{ hashFiles('vcpkg.json') }}

  universal-binary:
    name: Universal binary
    needs: [build-macos]
    runs-on: macos-26
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Download x86_64
        uses: actions/download-artifact@v8
        with:
          name: melonRA-macOS-x86_64.zip
          path: x86_64
          skip-decompress: true
      - name: Download arm64
        uses: actions/download-artifact@v8
        with:
          name: melonRA-macOS-arm64.zip
          path: arm64
          skip-decompress: true
      - name: Combine app bundles
        shell: bash
        run: |
          unzip x86_64/*.zip -d x86_64
          unzip arm64/*.zip -d arm64
          lipo {x86_64,arm64}/melonRA.app/Contents/MacOS/melonRA -create -output melonRA
          cp -a arm64/melonRA.app melonRA.app
          cp melonRA melonRA.app/Contents/MacOS/melonRA
          codesign -s - --deep melonRA.app
          zip -r -y melonRA-macOS-universal.zip melonRA.app
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: melonRA-macOS-universal
          path: melonRA-macOS-universal.zip
          archive: false
      - name: Check out sources (release script)
        if: github.ref_type == 'tag'
        uses: actions/checkout@v6
        with:
          path: src
      - name: Publish versioned release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="melonRA-${GITHUB_REF_NAME#v}-macOS-universal.zip"
          cp melonRA-macOS-universal.zip "$file"
          src/tools/ci-release.sh "$file"
