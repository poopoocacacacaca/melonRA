name: Windows

on:
  push:
    branches:
      - master
      - ci/*
  pull_request:
    branches:
      - master

env:
  MELONDS_GIT_BRANCH: ${{ github.ref_name }}
  MELONDS_GIT_REPO: ${{ github.repository }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
#  MELONDS_VERSION_SUFFIX: " RC"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            image: windows-2025-vs2026
          - name: arm64
            image: windows-11-arm

    name: ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.image }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
    - name: Check out sources
      uses: actions/checkout@v6
    - name: Restore vcpkg cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{ matrix.arch.name }}-windows-
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json
    - name: Build
      uses: lukka/run-cmake@v10
      with:
        configurePreset: release-windows-${{ matrix.arch.name }}
        configurePresetAdditionalArgs: "['-DENABLE_DEBUG_DEPS=OFF', '-DMELONDS_EMBED_BUILD_INFO=ON']"
        buildPreset: release-windows-${{ matrix.arch.name }}
    - uses: actions/upload-artifact@v7
      with:
        name: melonRA-windows-${{ matrix.arch.name }}
        path: .\build\release-windows-${{ matrix.arch.name }}\melonRA.exe
    - name: Save vcpkg cache
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles('vcpkg.json') }}

  # Publish every master build as a public "nightly" pre-release, so
  # testers can download it without a GitHub account
  publish:
    name: Publish nightly release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: true
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Package
      run: |
        for arch in x86_64 arm64; do
          (cd "artifacts/melonRA-windows-$arch" && zip -9 "$GITHUB_WORKSPACE/melonRA-windows-$arch.zip" melonRA.exe)
        done
        ls -la melonRA-windows-*.zip
    - name: Update nightly release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        {
          echo "Automatic build of the latest master commit ${GITHUB_SHA}."
          echo
          echo "**Download** \`melonRA-windows-x86_64.zip\` for most PCs, or \`melonRA-windows-arm64.zip\` for ARM Windows devices."
          echo "Unzip it anywhere and run \`melonRA.exe\`. It keeps its config next to the exe."
          echo
          echo "Then use **RetroAchievements > Log in...**. Until RetroAchievements approves melonRA for hardcore, hardcore unlocks are recorded as casual."
        } > notes.md
        gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
        gh release create nightly melonRA-windows-*.zip \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "melonRA nightly (${GITHUB_SHA::7})" \
          --notes-file notes.md
