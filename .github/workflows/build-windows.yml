name: Windows

on:
  push:
    branches:
      - master
      - ci/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

env:
  MELONDS_GIT_BRANCH: ${{ github.ref_name }}
  MELONDS_GIT_REPO: ${{ github.repository }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
#  MELONDS_VERSION_SUFFIX: " RC"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            image: windows-2025-vs2026
          - name: arm64
            image: windows-11-arm

    name: ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.image }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
    - name: Check out sources
      uses: actions/checkout@v6
    - name: Restore vcpkg cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{ matrix.arch.name }}-windows-
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json
    - name: Build
      uses: lukka/run-cmake@v10
      with:
        configurePreset: release-windows-${{ matrix.arch.name }}
        configurePresetAdditionalArgs: "['-DENABLE_DEBUG_DEPS=OFF', '-DMELONDS_EMBED_BUILD_INFO=ON']"
        buildPreset: release-windows-${{ matrix.arch.name }}
    - uses: actions/upload-artifact@v7
      with:
        name: melonRA-windows-${{ matrix.arch.name }}
        path: .\build\release-windows-${{ matrix.arch.name }}\melonRA.exe
    - name: Save vcpkg cache
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles('vcpkg.json') }}

  # Publish builds: every master push replaces the public "nightly" pre-release,
  # and version tags (v0.1.0, ...) create the versioned melonRA release.
  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: true
    steps:
    - name: Check out sources
      uses: actions/checkout@v6
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Package
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          prefix="melonRA-${GITHUB_REF_NAME#v}"
        else
          prefix="melonRA"
        fi
        for arch in x86_64 arm64; do
          (cd "artifacts/melonRA-windows-$arch" && zip -9 "$GITHUB_WORKSPACE/$prefix-windows-$arch.zip" melonRA.exe)
        done
        ls -la melonRA*-windows-*.zip
    - name: Publish versioned release
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
      run: tools/ci-release.sh melonRA-*-windows-*.zip
    - name: Update nightly release
      if: github.ref_type != 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
      run: tools/ci-release.sh melonRA-windows-*.zip
